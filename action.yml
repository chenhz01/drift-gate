name: drift-gate
description: Embedding drift watch: fingerprint retrieval quality so silent embedding drift cannot rot your RAG.
branding:
  icon: shield
  color: blue
inputs:
  args:
    description: Arguments passed to gate.py
    required: false
    default: "--help"
runs:
  using: composite
  steps:
    - shell: bash
      run: python "${{ github.action_path }}/gate.py" ${{ inputs.args }}
